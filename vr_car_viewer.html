<!DOCTYPE html>
<html lang="en">
<head>
    <title>VR Car Viewer - BMW Collection</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #07080b;
            color: #eef1f6;
            font-family: 'IBM Plex Sans', system-ui, sans-serif;
            font-size: 13px;
            overscroll-behavior: none;
        }

        #info {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 16px;
            border-radius: 999px;
            background: rgba(14, 18, 24, 0.66);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            font-size: 12px;
            letter-spacing: 0.02em;
            color: #b9c0cc;
            white-space: nowrap;
            max-width: 92vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #info b { color: #eef1f6; font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 600; }
        #info .accent { color: #52e0ff; }
        #info a { color: #52e0ff; text-decoration: none; }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'IBM Plex Sans Condensed', sans-serif;
            font-size: 15px;
            letter-spacing: 0.04em;
            color: #cdd4df;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .loading::before {
            content: "";
            width: 34px; height: 34px;
            border-radius: 50%;
            border: 2px solid rgba(82, 224, 255, 0.2);
            border-top-color: #52e0ff;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="info">
        <span class="accent">◆</span> <b>APEX·XR</b> <span>Detailing Studio</span> · Thumbsticks move &amp; rotate · Point &amp; trigger to interact
    </div>

    <div id="loading" class="loading">Preparing the studio…</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

        // Studio design tokens (kept in sync with the landing page)
        const STUDIO = {
            accent: 0x52e0ff,   // detailing softbox / accent cyan
            amber:  0xff9d4d,    // warm rim accent
            floor:  0x0a0c10,
            wall:   0x111318,
            rim:    0x2a3038
        };
        let turntable;           // rotating stage under the car
        let carEnvIntensity = 1.15;

        // In-headset UI constants (declared before init() so hoisted UI helpers can use them)
        const UI_PPU = 640;          // canvas px per world unit → sharp text
        const uiRedraws = [];        // redraw closures, re-run once the web font loads
        let currentCarName = 'Loading…';

        let camera, scene, renderer, environment;
        let currentCarIndex = 0;
        let cars = [];
        let carModels = [];
        let loadingElement;

        // VR Navigation variables - SIMPLIFIED
        let controller1, controller2;
        let raycaster = new THREE.Raycaster();
        let tempMatrix = new THREE.Matrix4();
        let moveVector = new THREE.Vector3();
        let userGroup = new THREE.Group(); // Simple user group instead of dolly

        // Car information - DYNAMIC LOADING
        let carData = []; // Will be populated dynamically
        
        // Known car models that we want to load (you can add more here)
        const knownModels = [
            "2018_bmw_m4_coupe_f82_lci.glb",
            "e36.glb",
            "bmw_e36_318ti.glb",
            "2018_bmw_m4_convertible_f83.glb",
            "2022_bmw_m4_gt3.glb",
            // "bmw_m3gtr.glb",
            "free_bmw_m3_e30.glb",
            "bmw_m4_adro_bodykit.glb",
        ];

        // UI Elements
        let uiGroup;
        let carNameText, switchButton, rotateButton;
        let isRotating = false;

        // Movement indicator for VR navigation feedback
        let movementIndicator;

        // Car control parameters
        let carControls = {
            scale: 1.0,
            positionX: 0,
            positionY: 0,  // Offset from original position
            positionZ: 0,   // Offset from original position
            rotationY: 0     // Additional rotation
        };

        // Store original car properties when loaded
        let originalCarProperties = {
            position: { x: 0, y: 0, z: 0 },
            scale: 1.0,
            rotation: { x: 0, y: 0, z: 0 }
        };

        // Audio system variables
        let audioListener;
        let currentCarAudio = null;
        let audioLoader;
        let carAudioData = []; // Will store audio references for each car

        init();

        function init() {
            loadingElement = document.getElementById('loading');

            // Scene setup - deep charcoal garage with a touch of atmospheric fog
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x07080b);
            scene.fog = new THREE.FogExp2(0x07080b, 0.028);

            RectAreaLightUniformsLib.init();

            // Camera
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 3);
            
            // Simple user group for VR navigation
            userGroup.add(camera);
            scene.add(userGroup);

            // Initialize audio system
            audioListener = new THREE.AudioListener();
            camera.add(audioListener);
            audioLoader = new THREE.AudioLoader();

            // Low ambient — the studio softboxes and IBL do most of the lighting work
            const ambientLight = new THREE.AmbientLight(0xaecbe0, 0.18);
            scene.add(ambientLight);

            // Key light from above/front for the primary shadow
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.4);
            directionalLight.position.set(4, 9, 6);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.setScalar(2048);
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 40;
            directionalLight.shadow.camera.left = -8;
            directionalLight.shadow.camera.right = 8;
            directionalLight.shadow.camera.top = 8;
            directionalLight.shadow.camera.bottom = -8;
            directionalLight.shadow.bias = -0.0004;
            directionalLight.shadow.normalBias = 0.02;
            scene.add(directionalLight);

            // Cool fill from the rear to separate the car from the dark walls
            const fillLight = new THREE.DirectionalLight(STUDIO.accent, 0.35);
            fillLight.position.set(-6, 5, -6);
            scene.add(fillLight);

            // Reflective studio floor (polished, mirror-like PBR)
            const groundGeometry = new THREE.PlaneGeometry(40, 40);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: STUDIO.floor,
                roughness: 0.12,
                metalness: 0.85,
                envMapIntensity: 0.55
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Showroom environment (walls, ceiling, detailing softboxes, turntable)
            createShowroom();

            // Renderer - cinematic settings for automotive paint
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setAnimationLoop(animate);
            renderer.xr.enabled = true;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.15;

            document.body.appendChild(renderer.domElement);

            // Image-based lighting: a neutral studio room gives cars real reflections
            const pmrem = new THREE.PMREMGenerator(renderer);
            environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
            scene.environment = environment;

            // VR Button
            document.body.appendChild(VRButton.createButton(renderer));

            // VR Navigation setup
            setupVRNavigation();

            // VR Controllers
            setupVRControllers();

            // UI in VR
            setupVRUI();

            // Repaint UI text once the IBM Plex Sans Condensed web font has loaded (crisp branded type)
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(() => refreshUIText()).catch(() => {});
                document.fonts.load('700 32px "IBM Plex Sans Condensed"').then(() => refreshUIText()).catch(() => {});
            }

            // Create movement indicator
            createMovementIndicator();

            // Discover and load cars
            initializeCarSystem();

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            
            // Add keyboard controls for debugging
            window.addEventListener('keydown', onKeyDown);
        }

        function createShowroom() {
            const wallHeight = 6;
            const wallWidth = 16;
            const roomDepth = 16;

            // Matte charcoal walls with a subtle top-to-bottom gradient feel
            const wallMaterial = new THREE.MeshStandardMaterial({
                color: STUDIO.wall,
                roughness: 0.9,
                metalness: 0.1,
                side: THREE.DoubleSide
            });

            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(wallWidth, wallHeight), wallMaterial);
            backWall.position.set(0, wallHeight / 2, -8);
            backWall.receiveShadow = true;
            scene.add(backWall);

            const frontWall = new THREE.Mesh(new THREE.PlaneGeometry(wallWidth, wallHeight), wallMaterial);
            frontWall.position.set(0, wallHeight / 2, 8);
            frontWall.rotation.y = Math.PI;
            scene.add(frontWall);

            const sideWallGeometry = new THREE.PlaneGeometry(roomDepth, wallHeight);
            const leftWall = new THREE.Mesh(sideWallGeometry, wallMaterial);
            leftWall.position.set(-8, wallHeight / 2, 0);
            leftWall.rotation.y = Math.PI / 2;
            leftWall.receiveShadow = true;
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(sideWallGeometry, wallMaterial);
            rightWall.position.set(8, wallHeight / 2, 0);
            rightWall.rotation.y = -Math.PI / 2;
            rightWall.receiveShadow = true;
            scene.add(rightWall);

            // Thin emissive accent trim where the walls meet the floor (garage glow line)
            const trimMat = new THREE.MeshStandardMaterial({
                color: STUDIO.accent, emissive: STUDIO.accent, emissiveIntensity: 1.6, toneMapped: true
            });
            const trimGeo = new THREE.BoxGeometry(wallWidth, 0.04, 0.04);
            [[-8, 'z', Math.PI / 2, roomDepth], [8, 'z', Math.PI / 2, roomDepth]].forEach(() => {});
            const backTrim = new THREE.Mesh(trimGeo, trimMat);
            backTrim.position.set(0, 0.05, -7.98);
            scene.add(backTrim);
            const sideTrimGeo = new THREE.BoxGeometry(roomDepth, 0.04, 0.04);
            const leftTrim = new THREE.Mesh(sideTrimGeo, trimMat);
            leftTrim.position.set(-7.98, 0.05, 0); leftTrim.rotation.y = Math.PI / 2;
            scene.add(leftTrim);
            const rightTrim = new THREE.Mesh(sideTrimGeo, trimMat.clone());
            rightTrim.position.set(7.98, 0.05, 0); rightTrim.rotation.y = Math.PI / 2;
            scene.add(rightTrim);

            // The rotating stage the car sits on
            createTurntable();

            // Detailing softbox rigs (the star of the show)
            createDetailingLights();

            // Refined ceiling light panels
            createHexagonalCeilingLights();
        }

        // Circular turntable platform with a glowing rim, centred under the car
        function createTurntable() {
            turntable = new THREE.Group();
            turntable.position.set(0, 0, -3);
            scene.add(turntable);

            // Raised dark platform disc
            const platMat = new THREE.MeshStandardMaterial({
                color: 0x0c0e13, roughness: 0.25, metalness: 0.9, envMapIntensity: 0.7
            });
            const platform = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.8, 0.12, 64), platMat);
            platform.position.y = 0.06;
            platform.receiveShadow = true;
            turntable.add(platform);

            // Glowing accent ring around the platform edge
            const ringMat = new THREE.MeshStandardMaterial({
                color: STUDIO.accent, emissive: STUDIO.accent, emissiveIntensity: 2.0
            });
            const ring = new THREE.Mesh(new THREE.TorusGeometry(2.62, 0.03, 12, 80), ringMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = 0.12;
            turntable.add(ring);

            // Soft inner disc so the car reads as sitting on a lit stage
            const innerMat = new THREE.MeshStandardMaterial({
                color: 0x11151b, roughness: 0.08, metalness: 1.0, envMapIntensity: 0.9
            });
            const inner = new THREE.Mesh(new THREE.CircleGeometry(2.5, 64), innerMat);
            inner.rotation.x = -Math.PI / 2;
            inner.position.y = 0.121;
            inner.receiveShadow = true;
            turntable.add(inner);
        }

        // Vertical + overhead detailing softboxes: emissive panels backed by RectAreaLights.
        // A mesh's front (+Z) and a light's emission (-Z) orient oppositely under lookAt,
        // so the panel and the light are aimed independently at the car.
        function createDetailingLights() {
            const target = new THREE.Vector3(0, 1.0, -3); // car centre on the stage
            const softboxes = [
                // [x, y, z, w, h, color, intensity]
                [-4.2, 2.3, -3.0, 1.1, 3.4, 0xffffff,      6.0],
                [ 4.2, 2.3, -3.0, 1.1, 3.4, 0xffffff,      6.0],
                [-3.2, 2.5,  1.4, 0.9, 3.0, STUDIO.accent, 3.4],
                [ 3.2, 2.5,  1.4, 0.9, 3.0, STUDIO.accent, 3.4],
                [ 0.0, 4.6, -3.0, 3.2, 1.2, 0xffffff,      4.2]  // overhead
            ];

            softboxes.forEach(([x, y, z, w, h, color, intensity]) => {
                // Physical light — emits along its local -Z, which lookAt aims at the target
                const rect = new THREE.RectAreaLight(color, intensity, w, h);
                rect.position.set(x, y, z);
                rect.lookAt(target);
                scene.add(rect);

                // Visible softbox — a mesh's front (+Z) faces the target under lookAt
                const rig = new THREE.Group();
                rig.position.set(x, y, z);
                scene.add(rig);
                rig.lookAt(target);

                const panel = new THREE.Mesh(
                    new THREE.PlaneGeometry(w, h),
                    new THREE.MeshStandardMaterial({
                        color: color, emissive: color, emissiveIntensity: 2.6,
                        roughness: 1, metalness: 0
                    })
                );
                rig.add(panel);

                const frame = new THREE.Mesh(
                    new THREE.PlaneGeometry(w + 0.12, h + 0.12),
                    new THREE.MeshStandardMaterial({ color: 0x23272f, roughness: 0.35, metalness: 0.85 })
                );
                frame.position.z = -0.02;
                rig.add(frame);

                // Thin stand pole to the floor for the tall side rigs
                if (h > 2.5) {
                    const pole = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.03, 0.03, y, 10),
                        new THREE.MeshStandardMaterial({ color: 0x3a3f48, roughness: 0.5, metalness: 0.7 })
                    );
                    pole.position.set(0, -y / 2 - h / 2 + 0.1, -0.06);
                    rig.add(pole);
                }
            });
        }

        function setupVRControllers() {
            const controllerModelFactory = new XRControllerModelFactory();

            // Controller 1
            controller1 = renderer.xr.getController(0);
            controller1.addEventListener('selectstart', onSelectStart);
            controller1.addEventListener('selectend', onSelectEnd);
            userGroup.add(controller1); // Add to userGroup for simple movement

            const controllerGrip1 = renderer.xr.getControllerGrip(0);
            controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
            userGroup.add(controllerGrip1);

            // Controller 2
            controller2 = renderer.xr.getController(1);
            controller2.addEventListener('selectstart', onSelectStart);
            controller2.addEventListener('selectend', onSelectEnd);
            userGroup.add(controller2);

            const controllerGrip2 = renderer.xr.getControllerGrip(1);
            controllerGrip2.add(controllerModelFactory.createControllerModel(controllerGrip2));
            userGroup.add(controllerGrip2);

            // Add extended pointer lines with visible ray projection
            const rayGeometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, -10) // Extended to 10 units
            ]);
            
            // Create visible ray line
            const rayMaterial = new THREE.LineBasicMaterial({
                color: STUDIO.accent,
                transparent: true,
                opacity: 0.6
            });
            const rayLine1 = new THREE.Line(rayGeometry, rayMaterial);
            const rayLine2 = new THREE.Line(rayGeometry, rayMaterial.clone());
            
            controller1.add(rayLine1);
            controller2.add(rayLine2);
            
            // Add targeting reticle at the end of the ray
            const reticleGeometry = new THREE.RingGeometry(0.02, 0.04, 24);
            const reticleMaterial = new THREE.MeshBasicMaterial({
                color: STUDIO.accent,
                transparent: true,
                opacity: 0.8,
                side: THREE.DoubleSide
            });
            
            const reticle1 = new THREE.Mesh(reticleGeometry, reticleMaterial);
            const reticle2 = new THREE.Mesh(reticleGeometry, reticleMaterial.clone());
            
            reticle1.position.set(0, 0, -3); // Position the reticle 3 units away
            reticle2.position.set(0, 0, -3);
            
            controller1.add(reticle1);
            controller2.add(reticle2);
            
            // Store references for dynamic updates
            controller1.userData.rayLine = rayLine1;
            controller1.userData.reticle = reticle1;
            controller2.userData.rayLine = rayLine2;
            controller2.userData.reticle = reticle2;
        }

        // ── In-headset UI: crisp canvas panels that match the DOM pill ──
        function panelCanvas(wUnits, hUnits) {
            const c = document.createElement('canvas');
            c.width = Math.max(2, Math.round(wUnits * UI_PPU));
            c.height = Math.max(2, Math.round(hUnits * UI_PPU));
            return c;
        }
        // The shared "smoked glass" panel: dark fill, faint top sheen, hairline border
        function drawPanel(ctx, radius) {
            const W = ctx.canvas.width, H = ctx.canvas.height;
            ctx.clearRect(0, 0, W, H);
            roundRect(ctx, 1, 1, W - 2, H - 2, radius); ctx.fillStyle = 'rgba(15, 19, 25, 0.9)'; ctx.fill();
            const sheen = ctx.createLinearGradient(0, 0, 0, H * 0.55);
            sheen.addColorStop(0, 'rgba(255,255,255,0.05)'); sheen.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = sheen; roundRect(ctx, 1, 1, W - 2, H * 0.55, radius); ctx.fill();
            const lw = Math.max(2, H * 0.02);
            ctx.lineWidth = lw; ctx.strokeStyle = 'rgba(233,235,240,0.13)';
            roundRect(ctx, lw / 2, lw / 2, W - lw, H - lw, radius); ctx.stroke();
        }
        function meshFromCanvas(canvas, wUnits, hUnits, opacity = 0.98) {
            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = 8; tex.colorSpace = THREE.SRGBColorSpace;
            const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity, alphaTest: 0.01, side: THREE.DoubleSide, depthWrite: false });
            return new THREE.Mesh(new THREE.PlaneGeometry(wUnits, hUnits), mat);
        }
        function cyanDiamond(ctx, cx, cy, s) {
            ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.PI / 4);
            ctx.fillStyle = '#57d1e6'; ctx.fillRect(-s, -s, 2 * s, 2 * s); ctx.restore();
        }
        // A rounded, grouping board that a cluster of controls sits on
        function makeBoard(wUnits, hUnits) {
            const c = panelCanvas(wUnits, hUnits), ctx = c.getContext('2d');
            const W = c.width, H = c.height, r = H * 0.05;
            roundRect(ctx, 1, 1, W - 2, H - 2, r); ctx.fillStyle = 'rgba(11, 13, 17, 0.8)'; ctx.fill();
            ctx.lineWidth = Math.max(2, H * 0.006); ctx.strokeStyle = 'rgba(233,235,240,0.10)';
            roundRect(ctx, 1, 1, W - 2, H - 2, r); ctx.stroke();
            return meshFromCanvas(c, wUnits, hUnits, 0.9);
        }

        function setupVRUI() {
            uiGroup = new THREE.Group();
            uiGroup.position.set(-2.05, 2.28, -4.3);
            scene.add(uiGroup);

            // Backing board — the controls read as one panel, not floating chips
            const board = makeBoard(1.8, 2.04);
            board.position.set(0, -0.92, -0.02);
            uiGroup.add(board);

            // Header + now-showing plate
            createHeaderPanel();

            const nameCanvas = panelCanvas(1.52, 0.4);
            drawCarName(nameCanvas.getContext('2d'), 'Loading…');
            carNameText = meshFromCanvas(nameCanvas, 1.52, 0.4);
            carNameText.position.set(0, -0.52, 0);
            uiGroup.add(carNameText);

            // Controls — two tidy columns
            const bw = 0.8, bh = 0.2, colX = 0.42;
            const rows = [
                [['Switch Car', switchCar], ['Auto Rotate: OFF', toggleRotation]],
                [['Reset View', resetUserPosition], ['Engine Sound', playCarStartup]],
                [['Scale −', scaleDown], ['Scale +', scaleUp]],
            ];
            rows.forEach((row, r) => {
                const y = -0.94 - r * 0.28;
                createButton(row[0][0], -colX, y, 0, row[0][1], bw, bh);
                createButton(row[1][0],  colX, y, 0, row[1][1], bw, bh);
            });

            createSliders();
        }

        function createButton(text, x, y, z, callback, width = 1, height = 0.25) {
            const canvas = panelCanvas(width, height);
            const context = canvas.getContext('2d');
            drawButtonFace(context, text);
            const button = meshFromCanvas(canvas, width, height, 0.98);
            button.position.set(x, y, z);
            button.userData = { callback, text, canvas, context, texture: button.material.map };
            uiGroup.add(button);
            return button;
        }

        // Branded header at the top of the control board
        function createHeaderPanel() {
            const canvas = panelCanvas(1.56, 0.26);
            const ctx = canvas.getContext('2d');
            const paint = () => {
                const H = canvas.height;
                drawPanel(ctx, H / 2);
                cyanDiamond(ctx, H * 0.6, H * 0.5, H * 0.11);
                ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
                ctx.fillStyle = '#eef1f6';
                ctx.font = `700 ${Math.round(H * 0.42)}px "IBM Plex Sans Condensed", Arial, sans-serif`;
                ctx.fillText('APEX', H * 0.95, H * 0.55);
                const apexW = ctx.measureText('APEX').width;
                ctx.fillStyle = '#8b93a3';
                ctx.font = `600 ${Math.round(H * 0.26)}px "IBM Plex Sans Condensed", Arial, sans-serif`;
                ctx.fillText('DETAILING STUDIO', H * 0.95 + apexW + H * 0.3, H * 0.56);
                ctx.textBaseline = 'alphabetic';
            };
            paint();
            const header = meshFromCanvas(canvas, 1.56, 0.26);
            header.position.set(0, -0.17, 0);
            uiGroup.add(header);
            uiRedraws.push(() => { paint(); header.material.map.needsUpdate = true; });
        }

        // Crisp pill button matching the top info pill
        function drawButtonFace(context, text) {
            const W = context.canvas.width, H = context.canvas.height;
            drawPanel(context, H / 2);
            cyanDiamond(context, H * 0.52, H * 0.5, H * 0.1);
            context.fillStyle = '#eef1f6';
            context.textAlign = 'center'; context.textBaseline = 'middle';
            let size = Math.round(H * 0.34);
            const pad = H * 1.0;                    // leave room for the marker
            context.font = `600 ${size}px "IBM Plex Sans Condensed", Arial, sans-serif`;
            while (context.measureText(text).width > W - pad && size > 10) {
                size -= 2; context.font = `600 ${size}px "IBM Plex Sans Condensed", Arial, sans-serif`;
            }
            context.fillText(text, (W + H * 0.7) / 2, H * 0.54);
            context.textBaseline = 'alphabetic';
        }

        function updateButtonText(button, newText) {
            button.userData.text = newText;
            drawButtonFace(button.userData.context, newText);
            button.userData.texture.needsUpdate = true;
        }

        // "Now showing" name plate
        function drawCarName(context, carName) {
            const W = context.canvas.width, H = context.canvas.height;
            drawPanel(context, H * 0.16);
            context.textAlign = 'center';
            context.fillStyle = 'rgba(87,209,230,0.95)';
            context.font = `600 ${Math.round(H * 0.135)}px "IBM Plex Sans Condensed", Arial, sans-serif`;
            context.fillText('N O W   S H O W I N G', W / 2, H * 0.3);
            context.fillStyle = '#ffffff';
            let size = Math.round(H * 0.3);
            context.font = `700 ${size}px "IBM Plex Sans Condensed", Arial, sans-serif`;
            while (context.measureText(carName).width > W * 0.9 && size > 12) {
                size -= 2; context.font = `700 ${size}px "IBM Plex Sans Condensed", Arial, sans-serif`;
            }
            context.fillText(carName, W / 2, H * 0.66);
        }

        function updateCarNameDisplay(carName) {
            currentCarName = carName;
            if (!carNameText) return;
            drawCarName(carNameText.material.map.image.getContext('2d'), carName);
            carNameText.material.map.needsUpdate = true;

        // Repaint every text panel once the web font is really available
        function refreshUIText() {
            uiRedraws.forEach((fn) => { try { fn(); } catch (e) {} });
            if (uiGroup) uiGroup.children.forEach((ch) => {
                if (ch.userData && ch.userData.callback && ch.userData.context) {
                    drawButtonFace(ch.userData.context, ch.userData.text);
                    ch.userData.texture.needsUpdate = true;
                }
            });
            updateCarNameDisplay(currentCarName);
            scene.traverse((ch) => {
                if (ch.userData && ch.userData.isSlider) updateSliderLabel(ch, carControls[ch.userData.property]);

        function createSliders() {
            // Right-hand "adjust" board, mirroring the control board
            const slidersGroup = new THREE.Group();
            slidersGroup.position.set(2.05, 2.28, -4.3);
            scene.add(slidersGroup);

            // Backing board (offset so it wraps the label + track cluster)
            const board = makeBoard(1.56, 1.9);
            board.position.set(-0.2, -0.9, -0.02);
            slidersGroup.add(board);

            // Title
            const titleCanvas = panelCanvas(1.32, 0.24);
            const tctx = titleCanvas.getContext('2d');
            const paintTitle = () => {
                const H = titleCanvas.height;
                drawPanel(tctx, H / 2);
                cyanDiamond(tctx, H * 0.6, H * 0.5, H * 0.11);
                tctx.fillStyle = '#eef1f6'; tctx.textBaseline = 'middle'; tctx.textAlign = 'left';
                tctx.font = `600 ${Math.round(H * 0.4)}px "IBM Plex Sans Condensed", Arial, sans-serif`;
                tctx.fillText('ADJUST', H * 0.95, H * 0.56);
                tctx.textBaseline = 'alphabetic';
            };
            paintTitle();
            const title = meshFromCanvas(titleCanvas, 1.32, 0.24);
            title.position.set(-0.2, -0.16, 0);
            slidersGroup.add(title);
            uiRedraws.push(() => { paintTitle(); title.material.map.needsUpdate = true; });

            const sliderWidth = 0.9;
            const sliderHeight = 0.05;
            const sliderSpacing = 0.3;
            const sliders = [
                { name: 'Scale',    min: 0.1, max: 100.0,      value: carControls.scale,     property: 'scale' },
                { name: 'Pos X',    min: -5,  max: 5,          value: carControls.positionX, property: 'positionX' },
                { name: 'Pos Y',    min: -2,  max: 3,          value: carControls.positionY, property: 'positionY' },
                { name: 'Pos Z',    min: -10, max: 2,          value: carControls.positionZ, property: 'positionZ' },
                { name: 'Rot Y',    min: 0,   max: Math.PI * 2, value: carControls.rotationY, property: 'rotationY' }
            ];

            sliders.forEach((sliderConfig, index) => {
                const yPos = -0.54 - index * sliderSpacing;

                // Wide invisible-ish hit area
                const background = new THREE.Mesh(
                    new THREE.PlaneGeometry(sliderWidth, sliderHeight * 4),
                    new THREE.MeshBasicMaterial({ color: 0x1a1e24, transparent: true, opacity: 0.5 }));
                background.position.set(0, yPos, 0);
                background.userData = { isSliderBackground: true };
                slidersGroup.add(background);

                // Track
                const track = new THREE.Mesh(
                    new THREE.PlaneGeometry(sliderWidth, sliderHeight),
                    new THREE.MeshBasicMaterial({ color: 0x3a4048, transparent: true, opacity: 0.9 }));
                track.position.set(0, yPos, 0.002);
                slidersGroup.add(track);

                // Glowing handle (3D object)
                const handle = new THREE.Mesh(
                    new THREE.BoxGeometry(0.06, sliderHeight * 3, 0.05),
                    new THREE.MeshStandardMaterial({ color: STUDIO.accent, emissive: STUDIO.accent, emissiveIntensity: 1.6 }));
                const normalizedValue = (sliderConfig.value - sliderConfig.min) / (sliderConfig.max - sliderConfig.min);
                handle.position.set((normalizedValue - 0.5) * sliderWidth, yPos, 0.02);
                handle.userData = {
                    isSlider: true, property: sliderConfig.property, min: sliderConfig.min,
                    max: sliderConfig.max, background: background, sliderWidth: sliderWidth
                };
                slidersGroup.add(handle);

                // Two-line label (name + value)
                const labelCanvas = panelCanvas(0.62, 0.2);
                const label = meshFromCanvas(labelCanvas, 0.62, 0.2, 0.97);
                label.position.set(-0.62, yPos, 0);
                handle.userData.label = label;
                handle.userData.labelCanvas = labelCanvas;
                handle.userData.labelContext = labelCanvas.getContext('2d');
                handle.userData.labelTexture = label.material.map;
                handle.userData.sliderName = sliderConfig.name;
                updateSliderLabel(handle, sliderConfig.value);
                slidersGroup.add(label);
            });
        }

        function updateSliderLabel(handle, value) {
            const ctx = handle.userData.labelContext;
            const W = ctx.canvas.width, H = ctx.canvas.height;
            drawPanel(ctx, H * 0.22);
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.fillStyle = '#8b93a3';
            ctx.font = `600 ${Math.round(H * 0.2)}px "IBM Plex Sans Condensed", Arial, sans-serif`;
            ctx.fillText(handle.userData.sliderName.toUpperCase(), W * 0.11, H * 0.36);
            ctx.fillStyle = '#eef1f6';
            ctx.font = `600 ${Math.round(H * 0.3)}px "IBM Plex Sans Condensed", Arial, sans-serif`;
            ctx.fillText(value.toFixed(2), W * 0.11, H * 0.72);
            ctx.textBaseline = 'alphabetic';
            handle.userData.labelTexture.needsUpdate = true;
        }

        function updateAllSliders() {
            // Find all slider handles in the scene and update their positions and labels
            scene.traverse((child) => {
                if (child.userData && child.userData.isSlider) {
                    const slider = child;
                    const userData = slider.userData;
                    const currentValue = carControls[userData.property];
                    
                    // Update handle position
                    const normalizedValue = (currentValue - userData.min) / (userData.max - userData.min);
                    const handleX = (normalizedValue - 0.5) * userData.sliderWidth;
                    slider.position.x = handleX;
                    
                    // Update label
                    updateSliderLabel(slider, currentValue);
                    
                    console.log(`Updated slider ${userData.property}: ${currentValue} -> position ${handleX}`);
                }
            });
        }

        function updateCarTransform() {
            if (!cars[0]) return;
            
            // Apply scale multiplicatively to the original scale
            cars[0].scale.setScalar(originalCarProperties.scale * carControls.scale);
            
            // Apply position offsets to the original position
            cars[0].position.set(
                originalCarProperties.position.x + carControls.positionX,
                originalCarProperties.position.y + carControls.positionY,
                originalCarProperties.position.z + carControls.positionZ
            );
            
            // Apply rotation additively to the original rotation
            cars[0].rotation.set(
                originalCarProperties.rotation.x,
                originalCarProperties.rotation.y + carControls.rotationY,
                originalCarProperties.rotation.z
            );
            
            console.log('Car updated with relative transforms:', carControls);
            console.log('Actual car position:', cars[0].position);
            console.log('Actual car scale:', cars[0].scale);
        }

        // Function to generate car name from filename
        function generateCarName(filename) {
            return filename
                .replace('.glb', '')
                .replace(/[_-]/g, ' ')
                .split(' ')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }

        // Function to discover available car models
        async function discoverCarModels() {
            console.log('🔍 Discovering available car models...');
            
            for (const filename of knownModels) {
                try {
                    // Test if file exists
                    const response = await fetch(`./models/${filename}`, { method: 'HEAD' });
                    if (response.ok) {
                        const carInfo = {
                            name: generateCarName(filename),
                            path: `./models/${filename}`,
                            scale: 1.0,
                            position: { x: 0, y: 0.13, z: -3 }, // sit on top of the turntable stage
                            rotation: { x: 0, y: 0, z: 0 }
                        };
                        carData.push(carInfo);
                        console.log(`✅ Found model: ${carInfo.name}`);
                    } else {
                        console.log(`⚠️ Model not found: ${filename}`);
                    }
                } catch (error) {
                    console.log(`⚠️ Error checking ${filename}:`, error);
                }
            }
            
            if (carData.length === 0) {
                console.log('⚠️ No car models found, creating fallback data');
                // Fallback if no models are found
                carData = [
                    {
                        name: "Fallback Car 1",
                        path: "./models/fallback1.glb",
                        scale: 1.0,
                        position: { x: 0, y: 0, z: -3 },
                        rotation: { x: 0, y: 0, z: 0 }
                    }
                ];
            }
            
            console.log(`🎉 Discovered ${carData.length} car models:`, carData.map(car => car.name));
        }

        function loadCars() {
            const loader = new GLTFLoader();
            let loadedCount = 0;

            console.log('🚗 Starting to load cars...');
            console.log('Car data:', carData);

            // Test file accessibility first
            carData.forEach((carInfo, index) => {
                fetch(carInfo.path, { method: 'HEAD' })
                    .then(response => {
                        if (response.ok) {
                            console.log(`✅ File accessible: ${carInfo.path}`);
                        } else {
                            console.warn(`⚠️ File not accessible: ${carInfo.path} (Status: ${response.status})`);
                        }
                    })
                    .catch(error => {
                        console.warn(`⚠️ Cannot check file: ${carInfo.path}`, error);
                    });
            });

            carData.forEach((carInfo, index) => {
                console.log(`📁 Attempting to load: ${carInfo.path}`);
                
                loader.load(
                    carInfo.path,
                    (gltf) => {
                        console.log(`✅ Successfully loaded: ${carInfo.name}`);
                        const model = gltf.scene;
                        
                        // NORMALIZE THE MODEL SIZE AND POSITION
                        const box = new THREE.Box3().setFromObject(model);
                        const size = box.getSize(new THREE.Vector3());
                        const center = box.getCenter(new THREE.Vector3());
                        
                        console.log(`Model ${carInfo.name} - Original size:`, size);
                        
                        // Calculate scale to make all cars roughly the same size (hero scale on the stage)
                        const targetSize = 2.7;
                        const maxDimension = Math.max(size.x, size.z); // Use X or Z, whichever is bigger
                        const autoScale = targetSize / maxDimension;
                        
                        // Apply consistent scaling
                        model.scale.setScalar(autoScale);
                        
                        // Recalculate after scaling
                        const scaledBox = new THREE.Box3().setFromObject(model);
                        const scaledCenter = scaledBox.getCenter(new THREE.Vector3());
                        
                        // Position consistently: centered, on ground, at specified Z
                        model.position.set(
                            carInfo.position.x - scaledCenter.x,
                            carInfo.position.y - scaledBox.min.y, // Place on ground
                            carInfo.position.z - scaledCenter.z
                        );
                        
                        model.rotation.set(carInfo.rotation.x, carInfo.rotation.y, carInfo.rotation.z);
                        
                        console.log(`Model ${carInfo.name} - Auto scale: ${autoScale}, Final position:`, model.position);
                        
                        // Enable shadows and feed the studio reflections into the paint
                        model.traverse((child) => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                                const mats = Array.isArray(child.material) ? child.material : [child.material];
                                mats.forEach((mat) => {
                                    if (mat && 'envMapIntensity' in mat) {
                                        mat.envMapIntensity = carEnvIntensity;
                                        mat.needsUpdate = true;
                                    }
                                });
                            }
                        });

                        carModels[index] = model;
                        
                        // Load audio for this car
                        loadCarAudio(carInfo, model).then((audio) => {
                            if (audio) {
                                console.log(`🔊 Audio loaded for ${carInfo.name}`);
                                
                                // If this is the first car, set it as current audio
                                if (index === 0) {
                                    currentCarAudio = audio;
                                    console.log('🔊 Set first car audio as currentCarAudio');
                                }
                            }
                        });
                        
                        loadedCount++;

                        // Show first car initially
                        if (index === 0) {
                            scene.add(model);
                            cars.push(model);
                            
                            // Initialize car controls to neutral values
                            carControls = {
                                scale: 1.0,
                                positionX: 0,
                                positionY: 0,
                                positionZ: 0,
                                rotationY: 0
                            };
                            
                            // Store original properties for relative transformations
                            originalCarProperties = {
                                position: { 
                                    x: model.position.x, 
                                    y: model.position.y, 
                                    z: model.position.z 
                                },
                                scale: model.scale.x, // Assuming uniform scale
                                rotation: { 
                                    x: model.rotation.x, 
                                    y: model.rotation.y, 
                                    z: model.rotation.z 
                                }
                            };
                            
                            updateCarNameDisplay(carInfo.name);
                            console.log('✅ First car added to scene');
                            console.log('Car controls initialized to:', carControls);
                            console.log('Original car properties stored:', originalCarProperties);
                        }

                        if (loadedCount === carData.length) {
                            document.getElementById('loading').style.display = 'none';
                            console.log('🎉 All cars loaded successfully!');
                        }
                    },
                    (progress) => {
                        const percent = (progress.loaded / progress.total * 100).toFixed(1);
                        console.log(`📦 Loading ${carInfo.name}: ${percent}%`);
                        document.getElementById('loading').textContent = `Loading ${carInfo.name}: ${percent}%`;
                    },
                    (error) => {
                        console.error(`❌ Error loading ${carInfo.name}:`, error);
                        console.error('Full path attempted:', carInfo.path);
                        
                        // Create a simple fallback car
                        const fallbackGeometry = new THREE.BoxGeometry(4, 1.5, 8);
                        const fallbackMaterial = new THREE.MeshPhongMaterial({ 
                            color: index === 0 ? 0x0066cc : 0xcc6600,
                            transparent: false
                        });
                        const fallbackModel = new THREE.Mesh(fallbackGeometry, fallbackMaterial);
                        fallbackModel.position.set(carInfo.position.x, carInfo.position.y + 0.75, carInfo.position.z);
                        fallbackModel.rotation.set(carInfo.rotation.x, carInfo.rotation.y, carInfo.rotation.z);
                        
                        // Add some detail to the fallback
                        const wheelGeometry = new THREE.CylinderGeometry(0.5, 0.5, 0.3);
                        const wheelMaterial = new THREE.MeshPhongMaterial({ color: 0x333333 });
                        
                        // Add wheels
                        const positions = [[-1.5, -0.5, 2.5], [1.5, -0.5, 2.5], [-1.5, -0.5, -2.5], [1.5, -0.5, -2.5]];
                        positions.forEach(pos => {
                            const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                            wheel.rotation.z = Math.PI / 2;
                            wheel.position.set(...pos);
                            fallbackModel.add(wheel);
                        });
                        
                        console.log(`🚗 Created fallback car for ${carInfo.name}`);
                        
                        carModels[index] = fallbackModel;
                        loadedCount++;

                        // Show first car initially
                        if (index === 0) {
                            scene.add(fallbackModel);
                            cars.push(fallbackModel);
                            
                            // Initialize car controls to neutral values
                            carControls = {
                                scale: 1.0,
                                positionX: 0,
                                positionY: 0,
                                positionZ: 0,
                                rotationY: 0
                            };
                            
                            // Store original properties for relative transformations
                            originalCarProperties = {
                                position: { 
                                    x: fallbackModel.position.x, 
                                    y: fallbackModel.position.y, 
                                    z: fallbackModel.position.z 
                                },
                                scale: fallbackModel.scale.x, // Assuming uniform scale
                                rotation: { 
                                    x: fallbackModel.rotation.x, 
                                    y: fallbackModel.rotation.y, 
                                    z: fallbackModel.rotation.z 
                                }
                            };
                            
                            updateCarNameDisplay(`${carInfo.name} (Fallback)`);
                            console.log('✅ First fallback car added to scene');
                            console.log('Car controls initialized to:', carControls);
                            console.log('Original fallback car properties stored:', originalCarProperties);
                        }

                        if (loadedCount === carData.length) {
                            document.getElementById('loading').style.display = 'none';
                            console.log('🎉 All cars loaded (some as fallbacks)!');
                        }
                    }
                );
            });
        }

                loadCars();

        function switchCar() {
            if (carModels.length === 0) return;

            // Stop current car audio
            stopCarAudio();

            // Remove current car
            if (cars[0]) {
                scene.remove(cars[0]);
                console.log('Removed current car from scene');
            }

            // Switch to next car
            currentCarIndex = (currentCarIndex + 1) % carModels.length;
            const newCar = carModels[currentCarIndex];
            
            if (newCar) {
                scene.add(newCar);
                cars[0] = newCar;
                
                // Update current car audio reference
                currentCarAudio = newCar.userData.audio || null;
                console.log('🔊 Updated currentCarAudio reference:', currentCarAudio ? 'Found' : 'Not found');
                
                // Reset car controls FIRST to neutral values
                carControls = {
                    scale: 1.0,
                    positionX: 0,
                    positionY: 0,
                    positionZ: 0,
                    rotationY: 0
                };
                
                // THEN store original properties of the new car (after any loading transforms)
                originalCarProperties = {
                    position: { 
                        x: newCar.position.x, 
                        y: newCar.position.y, 
                        z: newCar.position.z 
                    },
                    scale: newCar.scale.x, // Assuming uniform scale
                    rotation: { 
                        x: newCar.rotation.x, 
                        y: newCar.rotation.y, 
                        z: newCar.rotation.z 
                    }
                };
                
                console.log(`Added new car to scene: ${carData[currentCarIndex].name}`);
                console.log('Car controls reset to:', carControls);
                console.log('New car original properties:', originalCarProperties);
                
                // Update all slider positions and labels to reflect the reset values
                updateAllSliders();
                
                // Apply current transforms (which should be neutral, so car shows in original state)
                updateCarTransform();
                
                // Update display
                updateCarNameDisplay(carData[currentCarIndex].name);
                
                // Play startup sound for the new car after a short delay

                console.error('Car model not found at index:', currentCarIndex);
            }

        }

        function onSelectStart(event) {
            const controller = event.target;
            const intersections = getIntersections(controller);
            
            if (intersections.length > 0) {
                const intersection = intersections[0];
                const object = intersection.object;
                
                if (object.userData && object.userData.callback) {
                    // Regular button click
                    object.userData.callback();
                } else if (object.userData && (object.userData.isSlider || object.userData.isSliderBackground)) {
                    // Handle slider interaction
                    if (object.userData.isSliderBackground) {
                        // Find the corresponding slider handle
                        const sliderHandle = object.parent.children.find(child => 
                            child.userData && child.userData.isSlider && 
                            child.userData.background === object
                        );
                        if (sliderHandle) {
                            controller.userData.selectedSlider = sliderHandle;
                            controller.userData.isDragging = true;
                            console.log('Started dragging slider:', sliderHandle.userData.property);
                        }
                    } else if (object.userData.isSlider) {
                        // Direct selection of slider handle
                        controller.userData.selectedSlider = object;
                        controller.userData.isDragging = true;
                        console.log('Started dragging slider:', object.userData.property);
                    }
                }
            }
        }

        function onSelectEnd(event) {
            const controller = event.target;
            if (controller.userData.selectedSlider) {
                controller.userData.selectedSlider = null;
                controller.userData.isDragging = false;
            }
        }

        function getIntersections(controller) {
            const tempMatrix = new THREE.Matrix4();
            tempMatrix.identity().extractRotation(controller.matrixWorld);

            const raycaster = new THREE.Raycaster();
            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
            
            // Extend the raycaster range significantly
            raycaster.far = 15; // Extended range to 15 units
            raycaster.near = 0.1;

            // Check intersections with UI elements
            const uiIntersections = raycaster.intersectObjects(uiGroup.children, false);
            
            // Check intersections with sliders more thoroughly
            const allObjects = [];
            scene.traverse((child) => {
                if (child.userData && (child.userData.isSlider || child.userData.isSliderBackground)) {
                    allObjects.push(child);
                }
            });
            const sliderIntersections = raycaster.intersectObjects(allObjects, false);

            const allIntersections = [...uiIntersections, ...sliderIntersections];
            
            // Update visual feedback based on intersections
            updateControllerVisualFeedback(controller, allIntersections);

            return allIntersections;
        }
        
        function updateControllerVisualFeedback(controller, intersections) {
            const rayLine = controller.userData.rayLine;
            const reticle = controller.userData.reticle;
            
            if (!rayLine || !reticle) return;
            
            if (intersections.length > 0) {
                // Something is being targeted
                const intersection = intersections[0];
                const distance = intersection.distance;
                
                // Update ray color to indicate targeting
                rayLine.material.color.setHex(STUDIO.amber); // Warm accent when targeting
                rayLine.material.opacity = 0.9;

                // Position reticle at intersection point
                reticle.position.z = -distance;
                reticle.material.color.setHex(STUDIO.amber); // Warm accent when targeting
                reticle.material.opacity = 1.0;
                reticle.scale.setScalar(2); // Make reticle bigger when targeting
                
                // Update ray length to intersection
                const rayGeometry = rayLine.geometry;
                const positions = rayGeometry.attributes.position.array;
                positions[5] = -distance; // Update end point Z coordinate
                rayGeometry.attributes.position.needsUpdate = true;
                
            } else {
                // Nothing being targeted - return to default
                rayLine.material.color.setHex(STUDIO.accent); // Cyan default
                rayLine.material.opacity = 0.4;

                reticle.position.z = -3; // Default position
                reticle.material.color.setHex(STUDIO.accent); // Cyan default
                reticle.material.opacity = 0.6;
                reticle.scale.setScalar(1); // Normal size
                
                // Reset ray length to default
                const rayGeometry = rayLine.geometry;
                const positions = rayGeometry.attributes.position.array;
                positions[5] = -10; // Default length
                rayGeometry.attributes.position.needsUpdate = true;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onKeyDown(event) {
            if (!renderer.xr.isPresenting) {
                switch(event.code) {
                    case 'Space':
                        switchCar();
                        break;
                    case 'KeyR':
                        toggleRotation();
                        break;
                    case 'KeyE':
                        carControls.scale = Math.min(2.0, carControls.scale + 0.1);
                        updateCarTransform();
                        break;
                    case 'KeyQ':
                        carControls.scale = Math.max(0.1, carControls.scale - 0.1);
                        updateCarTransform();
                        break;
                    case 'ArrowUp':
                        carControls.positionZ = Math.max(-10, carControls.positionZ - 0.2);
                        updateCarTransform();
                        break;
                    case 'ArrowDown':
                        carControls.positionZ = Math.min(2, carControls.positionZ + 0.2);
                        updateCarTransform();
                        break;
                    case 'ArrowLeft':
                        carControls.positionX = Math.max(-5, carControls.positionX - 0.2);
                        updateCarTransform();
                        break;
                    case 'ArrowRight':
                        carControls.positionX = Math.min(5, carControls.positionX + 0.2);
                        updateCarTransform();
                        break;
                    case 'KeyW':
                        carControls.positionY = Math.min(3, carControls.positionY + 0.2);
                        updateCarTransform();
                        break;
                    case 'KeyS':
                        carControls.positionY = Math.max(-2, carControls.positionY - 0.2);
                        updateCarTransform();
                        break;
                    case 'KeyA':
                        carControls.rotationY = (carControls.rotationY - 0.1) % (Math.PI * 2);
                        updateCarTransform();
                        break;
                    case 'KeyD':
                        carControls.rotationY = (carControls.rotationY + 0.1) % (Math.PI * 2);
                        updateCarTransform();
                        break;
                }
                console.log('Car controls:', carControls);
            }
        }

        function setupVRNavigation() {
            // Get controllers for navigation
            controller1 = renderer.xr.getController(0);
            controller2 = renderer.xr.getController(1);
            
            // Add navigation event listeners
            controller1.addEventListener('connected', function(event) {
                const gamepad = event.data.gamepad;
                if (gamepad) {
                    controller1.userData.gamepad = gamepad;
                }
            });

            controller2.addEventListener('connected', function(event) {
                const gamepad = event.data.gamepad;
                if (gamepad) {
                    controller2.userData.gamepad = gamepad;
                }
            });
        }

        function handleVRNavigation() {
            // Simple VR navigation
            if (!renderer.xr.isPresenting) return;

            let isMovingNow = false;

            // Check controller 1 for movement
            if (controller1 && controller1.userData.gamepad) {
                const gamepad = controller1.userData.gamepad;
                if (gamepad.axes && gamepad.axes.length >= 4) {
                    const thumbstickX = gamepad.axes[2];
                    const thumbstickY = gamepad.axes[3];
                    
                    if (Math.abs(thumbstickX) > 0.15 || Math.abs(thumbstickY) > 0.15) {
                        isMovingNow = true;
                        
                        // Simple forward/backward movement
                        userGroup.getWorldDirection(moveVector);
                        moveVector.y = 0;
                        moveVector.normalize();
                        
                        const moveSpeed = 0.05;
                        moveVector.multiplyScalar(-thumbstickY * moveSpeed);
                        userGroup.position.add(moveVector);
                        
                        // Simple rotation
                        const rotateSpeed = 0.02;
                        userGroup.rotateY(-thumbstickX * rotateSpeed);
                    }
                }
            }

            // Update movement indicator
            if (movementIndicator) {
                movementIndicator.visible = isMovingNow;
                if (isMovingNow) {
                    movementIndicator.rotation.z += 0.1;
                }
            }
        }

        function animate() {
            // Handle VR controller slider dragging
            const controller1 = renderer.xr.getController(0);
            const controller2 = renderer.xr.getController(1);
            
            // Update controller visual feedback continuously
            if (renderer.xr.isPresenting) {
                if (controller1.userData.rayLine) {
                    getIntersections(controller1); // This updates visual feedback
                }
                if (controller2.userData.rayLine) {
                    getIntersections(controller2); // This updates visual feedback
                }
            }
            
            [controller1, controller2].forEach(controller => {
                if (controller.userData.isDragging && controller.userData.selectedSlider) {
                    const slider = controller.userData.selectedSlider;
                    const userData = slider.userData;
                    
                    // Use raycasting to determine slider position
                    const tempMatrix = new THREE.Matrix4();
                    tempMatrix.identity().extractRotation(controller.matrixWorld);

                    const raycaster = new THREE.Raycaster();
                    raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
                    raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
                    
                    // Intersect with the slider background plane
                    const intersections = raycaster.intersectObject(userData.background);
                    
                    if (intersections.length > 0) {
                        const intersection = intersections[0];
                        const localPoint = intersection.point.clone();
                        
                        // Convert world point to slider's local coordinate system
                        userData.background.worldToLocal(localPoint);
                        
                        // Calculate slider value based on X position within slider bounds
                        const normalizedX = Math.max(-1, Math.min(1, localPoint.x / (userData.sliderWidth / 2)));
                        const newValue = userData.min + (normalizedX + 1) / 2 * (userData.max - userData.min);
                        
                        // Clamp the value to bounds
                        const clampedValue = Math.max(userData.min, Math.min(userData.max, newValue));
                        
                        // Update car controls
                        carControls[userData.property] = clampedValue;
                        
                        // Update slider handle position
                        const newHandleX = ((clampedValue - userData.min) / (userData.max - userData.min) - 0.5) * userData.sliderWidth;
                        slider.position.x = newHandleX;
                        
                        // Update label
                        updateSliderLabel(slider, clampedValue);
                        
                        // Update car transform
                        updateCarTransform();
                    }
                }
            });

            // Auto-rotate car if enabled
            if (isRotating && cars[0]) {
                cars[0].rotation.y += 0.01;
                carControls.rotationY = cars[0].rotation.y % (Math.PI * 2);
            }

            // Handle VR navigation
            handleVRNavigation();

            renderer.render(scene, camera);
        }
